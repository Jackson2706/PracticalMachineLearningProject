[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-sentiment-benchmark"
version = "0.1.0"
description = "Reproducible Korean sentiment data-scale and cross-domain contrastive benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
  "filelock>=3.13,<4",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.3,<3",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
report = ["matplotlib>=3.8,<4"]

[project.scripts]
ks-benchmark = "korean_sentiment.cli:main"

[tool.setuptools]
package-dir = {"" = "source/src"}

[tool.setuptools.packages.find]
where = ["source/src"]
include = ["korean_sentiment*"]

[tool.pytest.ini_options]
testpaths = ["source/tests"]
addopts = "-q"
