# Raw sources, split sizes, normalization and cleaning rules.
datasets:
  nsmc:
    display: NSMC
    domain: movie
    files:
      train: {url: "https://raw.githubusercontent.com/e9t/nsmc/master/ratings_train.txt", name: ratings_train.txt}
      test:  {url: "https://raw.githubusercontent.com/e9t/nsmc/master/ratings_test.txt",  name: ratings_test.txt}
    format: {header: true, columns: [id, text, label]}
    label_rule: binary            # supplied 0/1
    test_source: official_test    # train pool + val from train file, test from ratings_test.txt
  shopping:
    display: Shopping
    domain: product
    files:
      all: {url: "https://raw.githubusercontent.com/bab2min/corpus/master/sentiment/naver_shopping.txt", name: naver_shopping.txt}
    format: {header: false, columns: [rating, text]}
    label_rule: rating            # 1-2 -> 0, 4-5 -> 1, 3 dropped (count is logged)
    test_source: split
  steam:
    display: Steam
    domain: game
    files:
      all: {url: "https://raw.githubusercontent.com/bab2min/corpus/master/sentiment/steam.txt", name: steam.txt}
    format: {header: false, columns: [label, text]}
    label_rule: binary
    test_source: split

rating_map: {negative: [1, 2], positive: [4, 5], drop: [3]}

splits:
  train_pool: 8000
  val: 2000
  test: 2000
  # Every remaining clean review of the training source (text-disjoint from val/test) goes to
  # train_extra; subsets larger than train_pool are train_pool + a prefix of train_extra.
  train_extra: all

# Fixed rule-based normalization (src/ksent/data/normalize.py), applied in this order:
#   1 html.unescape  2 Unicode NFC (NOT NFKC: it remaps compatibility jamo ㅋ ㅠ ㅎ)
#   3 remove zero-width / control chars  4 lowercase Latin letters only
#   5 cap runs of >= 3 identical characters to 2  6 collapse whitespace and strip
# Digits, punctuation, emoji, jamo-only expressions, English words and profanity are kept.
# No spacing correction, no stopword removal, no digit replacement.
normalization:
  unicode_form: NFC
  max_repeat: 2

cleaning:                       # operates on normalized text
  drop_empty: true
  drop_conflicting_duplicates: true   # texts appearing with both labels are removed entirely
  keep_one_exact_duplicate: true
  drop_kiwi_empty: true               # reviews yielding zero Kiwi tokens (expected ~0)
