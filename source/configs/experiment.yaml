project_seed: 2026
tuning_seed: 777
final_seeds: [13, 42, 2026]
tuning_size: 8000
models: [tfidf_lr, tfidf_svm, tfidf_rf, tfidf_xgb, avg_mlp, lstm, gru, transformer, mamba]
tfidf:
  max_features: 10000
  ngram_range: [1, 2]
  sublinear_tf: true
neural:
  tokenizer: unicode_words
  vocab_cap: 20000
  min_frequency: 1
  max_sequence_length: 128
  batch_size: 64
  max_epochs: 20
  patience: 4
  gradient_clip: 1.0
  weight_decay: 0.01
  throughput_batch_size: 128
  latency_warmup: 10
  latency_repeats: 50
artifacts:
  retain_models: true
  retain_embeddings: false
  representation_sample_per_cell: 100
  representation_pair_count: 2000
  representation_seed: 9102
orchestration:
  stale_lock_seconds: 21600
  continue_on_error: true
